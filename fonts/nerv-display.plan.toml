# Nerv Display
# ------------
# A wider cut of Nerv Sans, for headlines only. Same design, same hand: this
# changes one parameter. Iosevka's normal width is shape 500 and extended is
# 600; the OS plan sits at 525, which is right for reading and too narrow at
# 40px, where the sidebearings stop being able to separate the letters.
[buildPlans.nerv-display]
family = "Nerv Display"
spacing = "quasi-proportional"
serifs = "sans"
export-glyph-names = false

[buildPlans.nerv-display.variants]
inherits = "buildPlans.nerv-sans"

[buildPlans.nerv-display.weights.regular]
shape = 400
menu  = 400
css   = 400

[buildPlans.nerv-display.weights.semibold]
shape = 600
menu  = 600
css   = 600

[buildPlans.nerv-display.weights.bold]
shape = 700
menu  = 700
css   = 700

[buildPlans.nerv-display.slopes.upright]
angle = 0
shape = "upright"
menu  = "upright"
css   = "normal"

[buildPlans.nerv-display.widths.normal]
shape = 600
menu  = 7
css   = "expanded"
